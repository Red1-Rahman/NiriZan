# CodeRabbit configuration for NiriZan.
#
# NiriZan is an open-source continuous evaluation infrastructure for
# production AI systems. CodeRabbit is an advisory reviewer here, not a
# merge gate. Repository CI, architectural contracts, and human review
# remain authoritative.

language: "en-US"
early_access: false
enable_free_tier: true

reviews:
  profile: "assertive"

  # CodeRabbit must not automatically approve or request changes.
  # Its findings remain advisory until reviewed by a maintainer.
  request_changes_workflow: false

  # PR documentation
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: >
    Summarize the purpose and scope of the change, the principal files or
    components affected, important behavioral or architectural consequences,
    and any notable testing or validation performed. Do not claim that CI or
    CodeRabbit proves correctness. Keep the summary concise and factual.

  review_status: true
  review_details: true
  review_progress: true

  # The canonical review-progress surface (review_progress, above) is what's
  # active. commit_status and fail_commit_status only take effect if
  # review_progress is ever disabled; left false here as a deliberate
  # default in that case, not because they're doing anything today.
  commit_status: false
  fail_commit_status: false

  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true

  # Repository organization
  suggested_labels: true
  auto_apply_labels: false

  # No general labeling_instructions entry for "slop" here — slop_detection
  # below is the single source of truth for that label. Two mechanisms
  # producing independent opinions under the same label name is exactly the
  # kind of divergence this project is currently working to eliminate
  # elsewhere in the codebase; not repeating it here.
  labeling_instructions: []

  suggested_reviewers: true
  auto_assign_reviewers: false
  suggested_reviewers_instructions: []

  # Unnecessary for NiriZan's review workflow.
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false

  path_filters: []

  # Narrow, repository-owned guidance aimed specifically at the failure mode
  # this project has already hit once: independently maintained duplicate
  # statistical helpers with silently divergent validation behavior. Scoped
  # to the directories where that risk is real, not the whole tree.
  # Deliberately does not reference docs/contracts.md, ARCHITECTURE.md, or
  # CONTRIBUTING.md as authoritative guidance — those currently have known
  # discrepancies (see the open duplicate-helpers issue and #9), and
  # import-linter + Ruff TID already enforce the dependency-direction rule
  # mechanically. This instruction targets duplication only, not
  # architecture conformance.
  path_instructions:
    - path: "src/nirizan/{metrics,regression,gate}/**/*.py"
      instructions: >
        When a change introduces or modifies a statistical, validation,
        regression, evaluation, or numerical helper, check these statistical
        layers for an existing implementation with the same or substantially
        overlapping purpose. Flag possible duplicate or divergent
        implementations for maintainer review. This guidance targets
        statistical-implementation duplication specifically and is not a
        general architectural dependency rule.

  abort_on_close: true
  disable_cache: false

  # Public-repository feature. Sole owner of the "slop" label — see the
  # empty labeling_instructions above.
  slop_detection:
    enabled: true
    label: "slop"

  # Review every non-draft PR automatically.
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    auto_pause_after_reviewed_commits: 5

chat:
  auto_reply: true

knowledge_base:
  # Keep repository-specific learnings local to NiriZan.
  learnings:
    scope: "local"

  # Enabled, but no filePatterns configured. Deliberately not pointing this
  # at docs/contracts.md, ARCHITECTURE.md, or CONTRIBUTING.md while those
  # documents have known discrepancies (see the open duplicate-helpers
  # issue and #9) — ingesting them as review criteria now would let
  # CodeRabbit cite text that's actively being corrected. Revisit once
  # those are resolved.
  code_guidelines:
    enabled: true

  web_search:
    enabled: true
