# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit configuration for NiriZan.
#
# NiriZan is an open-source continuous evaluation infrastructure for
# production AI systems. CodeRabbit is an advisory reviewer here, not a
# merge gate. Repository CI, architectural contracts, and human review
# remain authoritative.

language: "en-US"
early_access: false
enable_free_tier: true

reviews:
  profile: "assertive"

  # CodeRabbit must not automatically approve or request changes.
  # Its findings remain advisory until reviewed by a maintainer.
  request_changes_workflow: false

  # PR documentation
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: >
    Summarize the purpose and scope of the change, the principal files or
    components affected, important behavioral or architectural consequences,
    and any notable testing or validation performed. Do not claim that CI or
    CodeRabbit proves correctness. Keep the summary concise and factual.

  review_status: true
  review_details: true
  review_progress: true

  # review_progress is the canonical review-status surface.
  # commit_status is only used when review_progress is disabled, but keeping
  # both false prevents a future configuration change from unexpectedly
  # restoring the legacy commit-status mirror.
  commit_status: false
  fail_commit_status: false

  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true

  # Repository organization
  suggested_labels: true
  auto_apply_labels: false

  # General label suggestions are intentionally not configured here.
  # The dedicated slop detector below is the sole owner of the "slop" label.
  labeling_instructions: []

  # Disabled: with a small contributor base, CodeRabbit has no real
  # authorship pattern to draw from and defaults to suggesting a bot
  # ("copilot") as reviewer, which is just noise since auto-assignment
  # is off anyway.
  suggested_reviewers: false
  auto_assign_reviewers: false
  suggested_reviewers_instructions: []

  # Unnecessary for NiriZan's review workflow.
  in_progress_fortune: false
  poem: false

  # Do not generate AI-agent prompts in every review comment. CodeRabbit
  # remains an advisory reviewer, while maintainers decide how findings
  # should be acted upon.
  enable_prompt_for_ai_agents: false

  path_filters: []

  # docstrings generation disabled: low value for a repo this size, one
  # fewer checkbox to manage. unit_tests left enabled: it's opt-in via a
  # checkbox on the PR comment (not autonomous), and useful when a PR adds
  # logic with no coverage. Anything it generates should still get the same
  # scrutiny as hand-written tests before merge, per this repo's "advisory
  # only, human review is authoritative" philosophy above.
  finishing_touches:
    docstrings:
      enabled: false

  # Repository-owned targeted review guidance.
  #
  # These instructions supplement, rather than replace, deterministic CI.
  # They deliberately do not ingest ARCHITECTURE.md, docs/contracts.md, or
  # CONTRIBUTING.md as CodeRabbit "coding guidelines" because those documents
  # are currently living sources with known discrepancies and ongoing work.
  path_instructions:

    # Statistical duplicate/divergence detection.
    #
    # These three directories are intentionally scoped because they contain
    # the statistical/evaluation implementation where the repository has
    # already found independently maintained duplicate mathematical helpers.
    # This is not a general architectural dependency rule.
    - path: "src/nirizan/{metrics,regression,gate}/**/*.py"
      instructions: >
        When a change introduces or modifies a statistical, validation,
        regression, evaluation, or numerical helper, check these statistical
        layers for an existing implementation with the same or substantially
        overlapping purpose. Flag possible duplicate or divergent
        implementations for maintainer review. This guidance targets
        statistical-implementation duplication specifically and is not a
        general architectural dependency rule.

    # Contract documentation consistency.
    #
    # This is intentionally a path instruction rather than a CodeRabbit
    # coding-guideline document. The implementation remains the source that
    # must be inspected when checking whether the documentation is accurate.
    - path: "docs/contracts.md"
      instructions: >
        When this file is changed, compare every modified contract against
        the actual implementation it describes. Check Protocol methods,
        method signatures, Pydantic model fields, validation constraints,
        return types, optionality, and stated behavioral guarantees. Flag
        documentation that describes behavior not implemented in the code,
        implementation behavior that is absent from the contract, or
        changes that appear to silently alter an existing contract. Do not
        assume the current documentation is authoritative merely because it
        is documentation; verify claims against the implementation.

    # Test quality.
    #
    # CodeRabbit should assess whether tests actually provide protection,
    # rather than treating test count as evidence of correctness.
    - path: "tests/**/*.py"
      instructions: >
        Evaluate whether new or modified tests exercise real behavior rather
        than being tautological, over-mocked to the point of testing nothing,
        or copy-pasted with only superficial changes. Check whether important
        assertions would fail if the underlying behavior regressed. For tests
        covering statistical, validation, regression, evaluation, or numerical
        helpers, check whether a substantially similar implementation exists
        elsewhere in the statistical implementation layers and flag possible
        unacknowledged divergence for maintainer review. For tests that assert
        against a specific pinned dependency version, commit SHA, or action
        tag (for example, testing that a GitHub Action pin equals an exact
        version string), flag hard-coded expected values that will fail on
        the next routine, otherwise-correct dependency bump; prefer that such
        tests assert on the underlying property (format, internal consistency
        between related pins, absence of a known-bad pattern) rather than
        equality against a value that is expected to change.

    # Cross-platform behavior.
    #
    # cross-platform.yml verifies package importability and version reporting
    # on Linux, Windows, and macOS, but does not execute the complete test
    # suite on all three platforms.
    - path: "src/nirizan/**/*.py"
      instructions: >
        When a change may affect platform behavior, flag hardcoded POSIX path
        separators, assumptions about case-sensitive filesystems, reliance on
        platform-specific behavior, or other portability risks that successful
        package import alone would not reveal. Do not flag ordinary portable
        Python code merely because it is platform-neutral.

    # Runtime dependency declaration.
    #
    # packaging.yml validates that the built distribution is well-formed.
    # Development CI installs the project with the dev extra, so an undeclared
    # runtime dependency can remain hidden.
    - path: "src/nirizan/**/*.py"
      instructions: >
        If this change imports a new third-party runtime package, verify that
        the package is declared in pyproject.toml under the runtime
        dependencies rather than being reachable only through a development
        or test dependency. Flag possible undeclared runtime dependencies
        for maintainer review.

    # CI/CD workflow design and trigger safety.
    #
    # This repository already runs zizmor in CI (zizmor-workflow-audit job),
    # which deterministically catches hash-pin/version-comment mismatches,
    # excessive permissions, and template-injection risks in `run:` blocks.
    # Do not re-flag findings that class of static analysis already owns;
    # defer to zizmor's output for that. This instruction targets judgment
    # calls zizmor cannot make: whether a job's permissions match its actual
    # purpose, whether a new trigger changes the workflow's exposure to
    # untrusted input, and whether jobs have drifted out of sync with each
    # other.
    - path: ".github/workflows/**/*.yml"
      instructions: >
        When a workflow job requests elevated permissions (anything beyond
        the top-level `contents: read`), check that the elevation matches
        what the job actually does; flag permissions requested but unused,
        or permissions broader than the job's stated purpose requires. When
        a workflow's `on:` triggers change, especially additions of
        `pull_request_target`, `workflow_run`, or any trigger combined with
        access to secrets, check whether the job also checks out or executes
        code from the triggering ref; flag if untrusted input could reach a
        job with secret access. When a value derived from `github.event.*`
        or `secrets.*` is used inside a `run:` shell block rather than passed
        through `env:`, flag it as a script-injection risk. When multiple
        jobs in the same file perform comparable setup (tool versions,
        language versions, base images), flag inconsistency between them
        unless the difference appears deliberate. Do not flag hash-pin
        format or version-comment accuracy; that is zizmor's responsibility.

  abort_on_close: true
  disable_cache: false

  # Public-repository anti-slop detection.
  # This is intentionally separate from general label suggestions.
  slop_detection:
    enabled: true
    label: "slop"

  # Review every non-draft PR automatically.
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    auto_pause_after_reviewed_commits: 5

chat:
  auto_reply: true

knowledge_base:
  # Keep repository-specific learnings local to NiriZan.
  learnings:
    scope: "local"

  # Do not currently treat repository documentation as CodeRabbit's
  # authoritative coding guidelines. ARCHITECTURE.md, docs/contracts.md,
  # and CONTRIBUTING.md are living documents with known discrepancies and
  # ongoing architectural/contract work. Targeted path instructions above
  # provide narrower review guidance where appropriate.
  code_guidelines:
    enabled: false

  web_search:
    enabled: true
