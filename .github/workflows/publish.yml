name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Packaging"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    name: Publish distributions to PyPI
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/nirizan

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check downloaded distributions
        run: |
          echo "Downloaded distributions:"
          ls -lah dist/

      - name: Determine package version
        id: package
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]

          name = project["name"]
          version = project["version"]

          print(f"Package: {name}")
          print(f"Version: {version}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"name={name}\n")
              output.write(f"version={version}\n")
          PY

      - name: Check whether version exists on PyPI
        id: check
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          name = os.environ["PACKAGE_NAME"]
          version = os.environ["PACKAGE_VERSION"]

          url = f"https://pypi.org/pypi/{name}/{version}/json"

          try:
              with urllib.request.urlopen(url) as response:
                  exists = response.status == 200
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  exists = False
              else:
                  raise

          print(f"Package: {name}")
          print(f"Version: {version}")
          print(f"Already exists on PyPI: {exists}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"exists={'true' if exists else 'false'}\n")
          PY

      - name: Publish distributions to PyPI
        if: ${{ steps.check.outputs.exists == 'false' }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Skip publication
        if: ${{ steps.check.outputs.exists == 'true' }}
        run: |
          echo "Package ${{ steps.package.outputs.name }}==${{ steps.package.outputs.version }} already exists on PyPI."
          echo "No publication is necessary."
          echo "This is a successful no-op."