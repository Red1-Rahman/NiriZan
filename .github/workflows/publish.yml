name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Packaging"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    name: Publish distributions to PyPI
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/nirizan/

    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify distributions exist
        shell: bash
        run: |
          shopt -s nullglob

          files=(dist/*.whl dist/*.tar.gz)

          if [ "${#files[@]}" -ne 2 ]; then
            echo "Expected exactly 2 distribution files, found ${#files[@]}"
            exit 1
          fi

          wheel_count=(dist/*.whl)
          sdist_count=(dist/*.tar.gz)

          if [ "${#wheel_count[@]}" -ne 1 ]; then
            echo "Expected exactly 1 wheel, found ${#wheel_count[@]}"
            exit 1
          fi

          if [ "${#sdist_count[@]}" -ne 1 ]; then
            echo "Expected exactly 1 source distribution, found ${#sdist_count[@]}"
            exit 1
          fi

          echo "Downloaded distributions:"
          ls -lah dist/

      - name: Install packaging tools
        run: python -m pip install --upgrade packaging

      - name: Determine package version from wheel
        id: package
        run: |
          python - <<'PY'
          import glob
          import os

          from packaging.utils import parse_wheel_filename

          wheels = glob.glob("dist/*.whl")

          if len(wheels) != 1:
              raise SystemExit(
                  f"Expected exactly one wheel, found {len(wheels)}"
              )

          wheel_file = os.path.basename(wheels[0])
          name, version, _, _ = parse_wheel_filename(wheel_file)

          print(f"Package: {name}")
          print(f"Version: {version}")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"name={name}\n")
              output.write(f"version={version}\n")
          PY

      - name: Check whether version exists on PyPI
        id: check
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          name = os.environ["PACKAGE_NAME"]
          version = os.environ["PACKAGE_VERSION"]

          url = f"https://pypi.org/pypi/{name}/{version}/json"

          try:
              with urllib.request.urlopen(url) as response:
                  exists = response.status == 200
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  exists = False
              else:
                  raise

          print(f"Package: {name}")
          print(f"Version: {version}")
          print(f"Already exists on PyPI: {exists}")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"exists={'true' if exists else 'false'}\n"
              )
          PY

      - name: Publish distributions to PyPI
        if: ${{ steps.check.outputs.exists == 'false' }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Skip publication
        if: ${{ steps.check.outputs.exists == 'true' }}
        run: |
          echo "Package ${{ steps.package.outputs.name }}==${{ steps.package.outputs.version }} already exists on PyPI."
          echo "No publication is necessary."
          echo "This is a successful no-op."