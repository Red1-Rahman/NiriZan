name: Dependency Graph

# Manual trigger only. Deliberately no `push` or `pull_request` triggers --
# this workflow never runs as a side effect of a push or merge, only when
# someone explicitly requests it from the Actions tab (or `gh workflow run`).
on:
  workflow_dispatch: {}

permissions:
  contents: write        # to push the generated-doc branch (not main)
  pull-requests: write    # to open the PR

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The checkout step doesn't need to push anything itself (the
          # create-pull-request step below authenticates with its own
          # token), so drop the persisted git credential rather than leave
          # it sitting in the local git config for the rest of the job.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      # No package install step: gen_dependency_graph.py is stdlib-only by
      # design, so its read/write footprint is fully auditable from the
      # script itself -- nothing else runs that could touch other files.
      - name: Generate dependency graph
        run: python .github/scripts/gen_dependency_graph.py

      - name: Show diff
        run: |
          git diff --stat -- docs/dependency-graph.md || true

      - name: Open pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Restrict the PR to exactly this file, even if something
          # unexpected changed elsewhere in the working tree -- belt and
          # braces on top of the script only ever writing this one path.
          add-paths: docs/dependency-graph.md
          commit-message: "docs: regenerate dependency graph"
          branch: docs/dependency-graph-update
          delete-branch: true
          base: main
          title: "docs: regenerate dependency graph"
          body: |
            Auto-generated by the `dependency-graph` workflow
            (`.github/scripts/gen_dependency_graph.py`), triggered manually.

            This PR only touches `docs/dependency-graph.md`. Review the diff
            before merging -- the generator is a static heuristic (AST-based
            import scan; "possibly-unused exports" only checks explicit
            `from module import name` usage, so it can have false positives
            for attribute-style access like `module.name(...)`).
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          labels: |
            documentation
            automated

      # The step's own outputs are passed through `env` rather than
      # interpolated directly into the `run:` script, so a value containing
      # shell metacharacters can't expand as code in this step.
      - name: Summary
        if: steps.cpr.outputs.pull-request-number
        env:
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          echo "Opened PR #${PR_NUMBER}: ${PR_URL}"
