name: Security (CIA)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'   # Weekly re-scan

permissions:
  contents: read

jobs:
  # ----------------------------------------
  # LOCAL REGRESSION: Run AST Security Suite
  # ----------------------------------------
  local-ast-security-test:
    name: Run test_security.py AST Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run local security tests
        run: |
          pip install pytest .
          pytest tests/test_security.py

  # ----------------------------------------
  # CONFIDENTIALITY & INTEGRITY: VirusTotal
  # ----------------------------------------
  virustotal-scan:
    name: VirusTotal Build Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Build Package Distributions
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Run VirusTotal Security Scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          python .github/scripts/virustotal_scan.py dist/*.whl dist/*.tar.gz

  # ----------------------------------------
  # INTEGRITY: GuardDog Malware Scan
  # ----------------------------------------
  guarddog-malware-check:
    name: GuardDog Malware Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build tools & GuardDog
        run: pip install guarddog build

      - name: Build wheel artifact
        run: python -m build

      - name: Run GuardDog on compiled package
        run: guarddog pypi scan dist/*.whl --output-format json | tee guarddog.json

      - name: Gate on GuardDog Findings
        run: |
          python -c "
          import json, sys
          d = json.load(open('guarddog.json'))
          reports = d if isinstance(d, list) else [d]

          def is_risky(report):
              if report.get('errors'):
                  return True
              if report.get('risks'):
                  return True
              risk_label = (report.get('risk_score') or {}).get('label')
              if risk_label is not None:
                  return risk_label != 'no_risks_detected'
              return report.get('issues', 0) > 0

          sys.exit(1 if any(is_risky(report) for report in reports) else 0)
          "

  # ----------------------------------------
  # CONFIDENTIALITY & INTEGRITY: SAST
  # ----------------------------------------
  sast-bandit-dlint:
    name: Python Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: pip install bandit flake8 dlint dodgy
      - run: bandit -r nirizan -ll -ii -x tests
      - run: flake8 --select=D nirizan
      - run: dodgy nirizan

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/default
            p/python
            p/owasp-top-ten
            p/bandit
            p/security-audit

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: python
          queries: +security-and-quality

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

  # ----------------------------------------
  # AVAILABILITY & INTEGRITY: Dependency Scans
  # ----------------------------------------
  dependency-scan:
    name: Pip Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: pip install pip-audit build
      - run: python -m build
      - run: pip install dist/*.whl
      - run: |
          pip freeze > requirements-frozen.txt
          pip-audit -r requirements-frozen.txt --strict

  osv-scanner:
    name: Google OSV Scanner
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --recursive
        ./

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  # ----------------------------------------
  # CONFIDENTIALITY: Secret Detection
  # ----------------------------------------
  secrets:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------
  # INTEGRITY: CI/CD Pipeline Audit
  # ----------------------------------------
  zizmor-workflow-audit:
    name: Zizmor Actions Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  # ----------------------------------------
  # INTEGRITY: Software Bill of Materials
  # ----------------------------------------
  sbom-generation:
    name: Generate SBOM (Syft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: nirizan-sbom.spdx.json
          upload-artifact: true