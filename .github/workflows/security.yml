name: Security (CIA)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  # ----------------------------------------
  # LOCAL AST SECURITY SUITE
  # ----------------------------------------
  local-ast-security-test:
    name: Run test_security.py AST Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies & run security tests
        run: |
          pip install pytest .
          pytest tests/test_security.py

  # ----------------------------------------
  # INTEGRITY: GuardDog Malware Scan
  # ----------------------------------------
  guarddog-malware-check:
    name: GuardDog Malware Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and run GuardDog on artifact
        run: |
          pip install guarddog build
          python -m build
          # Scan the built distribution artifact rather than the raw source directory
          guarddog pypi scan dist/*.whl --output-format json | tee guarddog.json

      - name: Gate on GuardDog Findings
        run: |
          python -c "import json, sys; d=json.load(open('guarddog.json')); issues=d.get('issues',0); sys.exit(1 if issues > 0 else 0)"

  # ----------------------------------------
  # AVAILABILITY & INTEGRITY: Dependency Scans
  # ----------------------------------------
  osv-scanner:
    name: Google OSV Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fixed: Use specific release tag v2.3.5 instead of unresolvable @v2
      - uses: google/osv-scanner-action@v2.3.5
        with:
          scan-args: |-
            --recursive
            ./

  # ----------------------------------------
  # INTEGRITY: CI/CD Pipeline Audit
  # ----------------------------------------
  zizmor-workflow-audit:
    name: Zizmor Actions Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      # Option A: Use official zizmor action (recommended)
      - uses: zizmorcore/zizmor-action@v0.6.2
        with:
          advanced-security: true

      # Option B (CLI Redirect approach with CodeQL v4):
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.12'
      # - run: pip install zizmor
      # - run: zizmor --format sarif . > zizmor.sarif || true
      # - uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: zizmor.sarif
