name: Security (CIA)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'   # Weekly re-scan

permissions:
  contents: read

jobs:
  # ----------------------------------------
  # LOCAL REGRESSION: Run AST Security Suite
  # ----------------------------------------
  local-ast-security-test:
    name: Run test_security.py AST Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run local security tests
        run: |
          pip install pytest .
          pytest tests/test_security.py

  # ----------------------------------------
  # CONFIDENTIALITY & INTEGRITY: VirusTotal
  # ----------------------------------------
  virustotal-scan:
    name: VirusTotal Build Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Package Distributions
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Run VirusTotal Security Scan
        uses: cssnr/virustotal-action@v2
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          file_globs: |
            dist/*.whl
            dist/*.tar.gz

  # ----------------------------------------
  # INTEGRITY: GuardDog Malware Scan
  # ----------------------------------------
  guarddog-malware-check:
    name: GuardDog Malware Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools & GuardDog
        run: pip install guarddog build

      - name: Build wheel artifact
        run: python -m build

      - name: Run GuardDog on compiled package
        run: guarddog pypi scan dist/*.whl --output-format json | tee guarddog.json

      - name: Gate on GuardDog Findings
        run: |
          python -c "
          import json, sys
          d = json.load(open('guarddog.json'))
          issues = d.get('issues', 0) if isinstance(d, dict) else len(d)
          sys.exit(1 if issues > 0 else 0)
          "

  # ----------------------------------------
  # CONFIDENTIALITY & INTEGRITY: SAST
  # ----------------------------------------
  sast-bandit-dlint:
    name: Python Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bandit flake8 dlint dodgy
      - run: bandit -r nirizan -ll -ii -x tests
      - run: flake8 --select=D nirizan
      - run: dodgy nirizan

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/python
            p/owasp-top-ten
            p/bandit
            p/security-audit

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: +security-and-quality
      - uses: github/codeql-action/analyze@v3

  # ----------------------------------------
  # AVAILABILITY & INTEGRITY: Dependency Scans
  # ----------------------------------------
  dependency-scan:
    name: Pip Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit build
      - run: python -m build
      - run: pip install dist/*.whl
      - run: |
          pip freeze > requirements-frozen.txt
          pip-audit -r requirements-frozen.txt --strict

  # Google OSV-Scanner MUST be invoked as a reusable workflow at the job level
  osv-scanner:
    name: Google OSV Scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0
    with:
      scan-args: |-
        --recursive
        ./

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.29.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  # ----------------------------------------
  # CONFIDENTIALITY: Secret Detection
  # ----------------------------------------
  secrets:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------
  # INTEGRITY: CI/CD Pipeline Audit
  # ----------------------------------------
  zizmor-workflow-audit:
    name: Zizmor Actions Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: zizmorcore/zizmor-action@v0.6.2
