name: Security Regression Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run security regression tests
        run: pytest tests/security/ -v --tb=short 2>&1 | tee pytest-output.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-security-output
          path: pytest-output.txt

  workflow-static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: npm ci --prefix tests/security/js
      - name: Run workflow and findings checks
        run: |
          set -o pipefail
          node tests/security/js/check-workflow-pins.cjs 2>&1 | tee workflow-analysis.txt
          node tests/security/js/validate-findings-schema.cjs tests/security/js/known-findings.json 2>&1 | tee findings-validation.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: workflow-static-analysis-output
          path: |
            workflow-analysis.txt
            findings-validation.txt