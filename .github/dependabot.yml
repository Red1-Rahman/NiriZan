version: 2

updates:
  # Python dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Patch and minor bumps are grouped into one PR per group per run,
      # so a routine week doesn't produce a dozen separate PRs. Major
      # bumps are deliberately excluded from grouping: each one gets its
      # own PR, since docs/import-boundaries.md and contracts.md both
      # treat a major dependency change (e.g. pydantic v2 -> v3) as an
      # event that deserves individual attention, not batching.
      python-patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "python"

  # Versions pinned inside .github/workflows/*.yml (e.g. actions/checkout@vN).
  #
  # No `directory` field here on purpose. For the github-actions ecosystem,
  # Dependabot always scans .github/workflows/*.yml (and /action.yml, if
  # this repo is itself a published action) regardless of what `directory`
  # is set to; it does not mean "look for workflows in this subfolder".
  # Setting directory: "/" here explicitly, as we originally did, tripped a
  # path-resolution bug where the job definition sent to the updater
  # resolved to "/." instead of "/", producing the error:
  #   "/action.yml or /.github/workflows/<anything>.yml not found"
  # Omitting the field lets Dependabot use its own default for this
  # ecosystem and avoids the malformed path entirely.
  - package-ecosystem: "github-actions"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      actions-patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "github-actions"
