[project]
name = "nirizan"
version = "0.2.0"
description = "Continuous evaluation infrastructure for production AI systems"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Redwan Rahman" }]
requires-python = ">=3.11"
keywords = [
    "llm-evaluation",
    "rag-evaluation",
    "ai-observability",
    "ai-testing",
    "llm-as-a-judge",
    "drift-detection",
    "regression-testing",
    "statistical-gating",
    "rag-triad",
    "hallucination-detection",
    "ci-cd-for-ai",
    "llm-benchmarking",
    "llm-reliability",
    "evaluation-framework",
    "opentelemetry-tracing"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3.0",
    "numpy>=1.26.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "import-linter>=2.0",
    "mypy>=1.10",
    "scipy-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nirizan"]


[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "TID", "UP", "B"]
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"


[tool.importlinter]
root_packages = ["nirizan"]

[[tool.importlinter.contracts]]
name = "NiriZan layer direction"
type = "layers"
layers = [
    "nirizan.reporting",
    "nirizan.gate",
    "nirizan.regression",
    "nirizan.orchestrator",
    "nirizan.trust",
    "nirizan.storage",
    "nirizan.metrics",
    "nirizan.instrumentation",
]


[[tool.importlinter.contracts]]
name = "storage.models may import metrics.base, nothing else from metrics"
type = "forbidden"
source_modules = ["nirizan.storage.models"]
forbidden_modules = ["nirizan.regression", "nirizan.gate", "nirizan.reporting", "nirizan.trust"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/nirizan"]
